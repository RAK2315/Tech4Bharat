<!doctype html><meta charset="utf-8"><title>Disposable browser parity test</title>
<h1>Browser parity test — this computer only</h1>
<p>CPU/WASM, one thread; same fitted model and fixed threshold. No phone compatibility or full browser quality-gate claim.</p>
<button id="run">Run parity test</button><pre id="status">Ready</pre>
<script src="node_modules/onnxruntime-web/dist/ort.wasm.min.js"></script>
<script>
const status=document.querySelector('#status');
function coeff(n,out){const scale=n/out, fs=Math.max(1,scale),support=fs;return Array.from({length:out},(_,i)=>{const center=(i+.5)*scale;const lo=Math.max(0,Math.floor(center-support+.5)),hi=Math.min(n,Math.floor(center+support+.5));let a=[],sum=0;for(let k=lo;k<hi;k++){let w=Math.max(0,1-Math.abs((k+.5-center)/fs));a.push([k,w]);sum+=w;}return a.map(([k,w])=>[k,w/sum]);});}
function resizePIL(data,w,h){const xc=coeff(w,224),yc=coeff(h,224),tmp=new Uint8Array(224*h*3),out=new Float32Array(3*224*224);for(let y=0;y<h;y++)for(let x=0;x<224;x++)for(let c=0;c<3;c++){let v=0;for(const[k,a]of xc[x])v+=data[(y*w+k)*4+c]*a;tmp[(y*224+x)*3+c]=Math.min(255,Math.max(0,Math.floor(v+.5)));}for(let y=0;y<224;y++)for(let x=0;x<224;x++)for(let c=0;c<3;c++){let v=0;for(const[k,a]of yc[y])v+=tmp[(k*224+x)*3+c]*a;out[c*224*224+y*224+x]=Math.min(255,Math.max(0,Math.floor(v+.5)))/255;}return out;}
async function infer(session,a){const t=performance.now();const result=await session.run({rgb:new ort.Tensor('float32',a,[1,3,224,224])});return{score:result.score.data[0],map:Array.from(result.map.data),ms:performance.now()-t};}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;let results={userAgent:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency,executionProvider:'wasm',threads:1,fixtures:[]};try{
ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=new URL('node_modules/onnxruntime-web/dist/',location.href).href;const meta=await(await fetch('../results/export_parity.json')).json();let t=performance.now();const bytes=await(await fetch('../models/padim.onnx')).arrayBuffer();results.model_bytes=bytes.byteLength;results.model_fetch_ms=performance.now()-t;t=performance.now();const session=await ort.InferenceSession.create(bytes,{executionProviders:['wasm'],graphOptimizationLevel:'all'});results.session_initialization_ms=performance.now()-t;
for(const fixture of meta.fixtures){status.textContent='Testing '+fixture.id+' ('+results.fixtures.length+'/'+meta.fixtures.length+')';const expected=new Float32Array(await(await fetch('../results/input_'+fixture.id+'.bin')).arrayBuffer());const exact=await infer(session,expected);
const start=performance.now();const blob=await(await fetch('../results/browser_'+fixture.id+'.png')).blob();const bitmap=await createImageBitmap(blob);const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0);const p=performance.now();const actual=resizePIL(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height);const preprocess_ms=performance.now()-p;let max=0,mean=0;for(let i=0;i<actual.length;i++){let d=Math.abs(actual[i]-expected[i]);max=Math.max(max,d);mean+=d;}const raw=await infer(session,actual);results.fixtures.push({id:fixture.id,native_score:fixture.native_score,native_onnx_score:fixture.onnx_score,browser_exact_tensor_score:exact.score,browser_exact_tensor_ms:exact.ms,browser_raw_image_score:raw.score,browser_raw_inference_ms:raw.ms,decode_resize_inference_ms:performance.now()-start,preprocess_ms,preprocess_max_abs_difference:max,preprocess_mean_abs_difference:mean/actual.length,native_flag:fixture.native_score>fixture.threshold,browser_flag:raw.score>fixture.threshold,threshold:fixture.threshold});}
results.complete=true;results.note='10 selected fixtures only; raw quality gate not ported. No phone tested.';
}catch(e){results.error=String(e);results.complete=false;}status.textContent=JSON.stringify(results,null,2);await fetch('/browser-results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(results)});};
</script>
